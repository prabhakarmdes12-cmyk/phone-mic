name: Android verification
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify preinstalled Android tools
        run: |
          java -version
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          ls "$ANDROID_HOME/cmdline-tools"
      - name: Install pinned Android packages
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1' 
      - run: ./gradlew :app:externalNativeBuildDebug
      - run: ./gradlew clean assembleDebug testDebugUnitTest lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
