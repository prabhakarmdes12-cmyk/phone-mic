name: Android verification
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify preinstalled Android tools
        run: |
          java -version
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          ls "$ANDROID_HOME/cmdline-tools"
      - name: Install pinned Android packages
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Native build with API-readable diagnostics
        shell: bash
        run: |
          set +e
          ./gradlew :app:externalNativeBuildDebug > native-build.log 2>&1
          result=$?
          cat native-build.log
          if [ "$result" -ne 0 ]; then
            details=$(tail -45 native-build.log)
            details="${details//'%'/'%25'}"
            details="${details//$'\n'/'%0A'}"
            details="${details//$'\r'/'%0D'}"
            echo "::error::$details"
          fi
          exit "$result"
      - name: APK, unit tests and lint
        shell: bash
        run: |
          set +e
          ./gradlew clean assembleDebug testDebugUnitTest lintDebug > verification.log 2>&1
          result=$?
          cat verification.log
          if [ "$result" -ne 0 ]; then
            details=$(tail -100 verification.log)
            details="${details//'%'/'%25'}"
            details="${details//$'\n'/'%0A'}"
            details="${details//$'\r'/'%0D'}"
            echo "::error::$details"
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: PhoneMic-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
